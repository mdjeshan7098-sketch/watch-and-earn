<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Watchly Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:20px;
  font-family:Arial,sans-serif;
  background:#07111f;
  color:white;
}
.container{
  max-width:600px;
  margin:auto;
}
h1{margin-bottom:5px}
.sub{color:#8fa0b5;margin-bottom:20px}
.card{
  background:#101d30;
  border:1px solid #1c2c43;
  border-radius:16px;
  padding:18px;
  margin-bottom:15px;
}
.pending{
  color:#fbbf24;
  font-weight:bold;
}
button{
  border:0;
  border-radius:10px;
  padding:12px;
  color:white;
  font-weight:bold;
  cursor:pointer;
  margin-top:8px;
}
.approve{
  background:#16a34a;
  width:48%;
}
.reject{
  background:#dc2626;
  width:48%;
}
.refresh{
  width:100%;
  background:#2563eb;
}
.info{
  color:#9eacc0;
  font-size:14px;
  line-height:1.7;
}
.message{
  text-align:center;
  color:#60a5fa;
  margin:15px 0;
}
</style>
</head>

<body>

<div class="container">

<h1>🛠️ Watchly Admin</h1>
<div class="sub">Withdrawal Management</div>

<button class="refresh" onclick="loadWithdrawals()">
🔄 REFRESH REQUESTS
</button>

<div id="message" class="message"></div>

<div id="withdrawals">
Loading...
</div>

</div>

<script>

const SUPABASE_URL =
"https://woyvafgecfuriavuxnje.supabase.co";

const SUPABASE_KEY =
"sb_publishable_lxrfM4MgeRSm8-CiiUGQZg_EdayI2Po";

const ADMIN_ID =
"f9e5de16-25c8-461f-a1d8-34cc56debf73";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


async function checkAdmin(){

const result =
await supabaseClient.auth.getSession();

const session =
result.data?.session;

if(!session){

document.getElementById("withdrawals").innerHTML =
"<div class='card'>❌ Please login first.</div>";

return false;
}

if(session.user.id !== ADMIN_ID){

document.getElementById("withdrawals").innerHTML =
"<div class='card'>❌ Admin access denied.</div>";

return false;
}

return true;
}


async function loadWithdrawals(){

const allowed =
await checkAdmin();

if(!allowed)
return;

const container =
document.getElementById("withdrawals");

container.innerHTML =
"Loading requests...";

const result =
await supabaseClient
.from("withdrawals")
.select(
"id,user_id,amount,method,account_number,status,created_at"
)
.order(
"created_at",
{ascending:false}
);

if(result.error){

container.innerHTML =
"<div class='card'>❌ "+
result.error.message+
"</div>";

return;
}

if(!result.data ||
result.data.length === 0){

container.innerHTML =
"<div class='card'>No withdrawal requests.</div>";

return;
}


container.innerHTML =
result.data.map(function(item){

const status =
String(item.status || "pending")
.toLowerCase();

let buttons = "";

if(status === "pending"){

buttons = `
<div style="display:flex;justify-content:space-between">
<button class="approve"
onclick="processWithdrawal(${item.id},'approve')">
✅ APPROVE
</button>

<button class="reject"
onclick="processWithdrawal(${item.id},'reject')">
❌ REJECT
</button>
</div>
`;

}

return `
<div class="card">

<div>
Status:
<span class="pending">
${item.status}
</span>
</div>

<div class="info">

🆔 Withdrawal ID:
${item.id}<br>

👤 User:
${item.user_id}<br>

🪙 Amount:
<strong>${item.amount} coins</strong><br>

💳 Method:
${item.method}<br>

📱 bKash:
<strong>${item.account_number}</strong><br>

🕒 ${new Date(item.created_at).toLocaleString()}

</div>

${buttons}

</div>
`;

}).join("");

}


async function processWithdrawal(id,action){

const word =
action === "approve"
? "approve"
: "reject";

if(!confirm(
"Are you sure you want to "+
word+
" this withdrawal?"
)){

return;
}

document.getElementById("message").textContent =
"⏳ Processing...";

const result =
await supabaseClient.rpc(
"process_withdrawal",
{
p_withdrawal_id:id,
p_action:action
}
);

if(result.error){

console.error(result.error);

document.getElementById("message").textContent =
"❌ "+
result.error.message;

return;
}

document.getElementById("message").textContent =
action === "approve"
? "✅ Withdrawal approved!"
: "↩️ Withdrawal rejected and coins refunded.";

await loadWithdrawals();

}


loadWithdrawals();

</script>

</body>
</html>
